# Turno notturno — fa lavorare Agnes su GitHub, senza che resti acceso un PC.
#
# SECURITY MODEL:
# - Il loop lavora in un runner effimero, non sul branch remoto
# - Produce commit locali → bundle → job privilegiato → push su branch turno/<run_id> → PR
# - La revisione umana e' un hard gate: mai push diretto su sviluppo/main
# - Separazione dei poteri: chi esegue codice AI (esecuzione-turno) ha solo read;
#   chi pubblica (pubblicazione-pr) ha write ma non esegue codice non trusted
#
# Il lavoro NON finisce su `sviluppo`: il turno committa in locale sul runner,
# poi il risultato viene spinto su un ramo `turno/<run_id>` e aperto in Pull
# Request. La revisione resta umana, ed e' voluto — la notte del 27 il turno ha
# committato una funzione sbagliata su otto cognomi italiani comuni su
# diciannove, le guardie non potevano vederla (diff piccolo e nel perimetro) e
# l'ha presa il Collaudatore *dopo* il commit. Con il push diretto quel codice
# sarebbe gia' pubblico.
#
# Due segreti da impostare una volta sola, nelle impostazioni del repository:
#   AGNES_API_KEY   la chiave dell'API Agnes
#   MACCHINA_TOKEN  un token in sola lettura sul repository privato della
#                   macchina (Contents: read basta)
#
# Environment richiesto: 'turno-notturno' con secrets AGNES_API_KEY e MACCHINA_TOKEN

name: turno notturno

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'ID separati da spazio (vuoto = la coda di notte.py)'
        required: false
        default: ''
      ore:
        description: 'budget in ore (1-24)'
        required: false
        default: '5'
      prova:
        description: 'solo i controlli, senza spendere chiamate'
        type: boolean
        required: false
        default: false

# Permissions GLOBALI vuote: ogni job riceve solo ciò che gli serve esplicitamente
permissions: {}

concurrency:
  group: turno-notturno
  cancel-in-progress: false

jobs:
  esecuzione-turno:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: turno-notturno

    # SECURITY: read-only — questo job esegue codice non trusted e NON deve poter pushare
    permissions:
      contents: read

    steps:
      - name: il bersaglio
        uses: actions/checkout@v4
        with:
          ref: sviluppo
          fetch-depth: 0
          path: bersaglio
          # SECURITY: default è true, lo disabilitiamo esplicitamente
          persist-credentials: false

      - name: la macchina
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/progetto-agnes
          token: ${{ secrets.MACCHINA_TOKEN }}
          path: macchina
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: dipendenze del bersaglio
        working-directory: bersaglio
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # SECURITY: input passati via env per evitare shell injection
      - name: valida input
        id: validate-inputs
        env:
          RAW_TASK: ${{ inputs.task }}
          RAW_ORE: ${{ inputs.ore }}
        run: |
          task="$RAW_TASK"
          ore="$RAW_ORE"
          
          if [[ -n "$task" ]]; then
            if ! echo "$task" | grep -qE '^([A-Z][0-9]+)( [A-Z][0-9]+)*$'; then
              echo "::error::Input task non valido"
              exit 1
            fi
          fi
          
          if ! echo "$ore" | grep -qE '^[0-9]+$'; then
            echo "::error::Input ore non valido"
            exit 1
          fi
          if [[ "$ore" -lt 1 || "$ore" -gt 24 ]]; then
            echo "::error::Input ore deve essere tra 1 e 24"
            exit 1
          fi
          
          echo "TASK=$task" >> $GITHUB_OUTPUT
          echo "ORE=$ore" >> $GITHUB_OUTPUT

      - name: il turno
        working-directory: bersaglio
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BERSAGLIO: ${{ github.workspace }}/bersaglio
          VALIDATED_TASK: ${{ steps.validate-inputs.outputs.TASK }}
          VALIDATED_ORE: ${{ steps.validate-inputs.outputs.ORE }}
          IS_PROVA: ${{ inputs.prova && 'true' || 'false' }}
        run: |
          git config user.name "Agnes Loop"
          git config user.email "agnes@localhost"
          
          # Cattura BASE_SHA prima dell'esecuzione
          echo "$(git rev-parse HEAD)" > /tmp/base_sha.txt
          
          prova_flag=""
          [[ "$IS_PROVA" == "true" ]] && prova_flag="--prova"
          
          task_args=""
          [[ -n "$VALIDATED_TASK" ]] && task_args="$VALIDATED_TASK"
          
          python "$GITHUB_WORKSPACE/macchina/officina/notte.py" \
            $prova_flag \
            --ore "$VALIDATED_ORE" \
            $task_args
        continue-on-error: true
        id: esecuzione

      - name: determina stato esecuzione
        if: always()
        id: stato
        run: |
          case "${{ steps.esecuzione.outcome }}" in
            success) echo "esito=successo" ;;
            failure) echo "esito=fallimento" ;;
            *) echo "esito=interrotto" ;;
          esac >> $GITHUB_OUTPUT
          
          cd bersaglio
          commit_count=$(git log origin/sviluppo..HEAD --oneline 2>/dev/null | wc -l | tr -d ' ')
          echo "commit_count=${commit_count:-0}" >> $GITHUB_OUTPUT
          
          cp /tmp/base_sha.txt /tmp/base_sha_artifact.txt

      - name: crea bundle dei commit
        if: always()
        working-directory: bersaglio
        run: |
          base_sha=$(cat /tmp/base_sha_artifact.txt)
          echo "$base_sha" > /tmp/base_sha_for_bundle.txt
          
          if git merge-base --is-ancestor "$base_sha" HEAD 2>/dev/null; then
            git bundle create /tmp/commiti.bundle "$base_sha"..HEAD
            echo "bundle_created=true" >> $GITHUB_OUTPUT
          else
            touch /tmp/no_bundle.marker
            echo "bundle_created=false" >> $GITHUB_OUTPUT
          fi
        id: bundle

      - name: il rapporto, comunque vada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turno-risultati-${{ github.run_id }}
          path: |
            macchina/stato/
            macchina/risultati/scartati/
            /tmp/base_sha_for_bundle.txt
            /tmp/commiti.bundle
            /tmp/no_bundle.marker
          if-no-files-found: warn
          retention-days: 30

      - name: genera summary
        if: always()
        run: |
          {
            echo "## Turno Notturno — Report"
            echo ""
            echo "| Campo | Valore |"
            echo "|---|---|"
            echo "| Run ID | ${{ github.run_id }} |"
            echo "| Data | $(date -u +%Y-%m-%d %H:%M UTC) |"
            echo "| Esito | ${{ steps.stato.outputs.esito }} |"
            echo "| Task | ${{ inputs.task || '(automatico)' }} |"
            echo "| Ore | ${{ inputs.ore }} |"
            echo "| Prova | ${{ inputs.prova && 'SI' || 'NO' }} |"
            echo "| Commit | ${{ steps.stato.outputs.commit_count }} |"
            echo ""
            if [[ -f "$GITHUB_WORKSPACE/macchina/stato/RAPPORTO.md" ]]; then
              echo "**Rapporto:** disponibile negli artifact"
            else
              echo "**Rapporto:** non generato"
            fi
          } >> $GITHUB_STEP_SUMMARY

    outputs:
      commit_count: ${{ steps.stato.outputs.commit_count }}
      esito: ${{ steps.stato.outputs.esito }}
      bundle_created: ${{ steps.bundle.outputs.bundle_created }}

  pubblicazione-pr:
    needs: esecuzione-turno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !inputs.prova && needs.esecuzione-turno.outputs.esito != 'interrotto' && needs.esecuzione-turno.outputs.bundle_created == 'true'

    # SECURITY: write solo per push e PR — questo job NON esegue codice non trusted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: scarica risultati
        uses: actions/download-artifact@v4
        with:
          name: turno-risultati-${{ github.run_id }}
          path: /tmp/artifact

      - name: leggi base_sha
        id: metadata
        run: |
          base_sha=$(cat /tmp/artifact/base_sha_for_bundle.txt 2>/dev/null || echo "")
          echo "base_sha=$base_sha" >> $GITHUB_OUTPUT

      - name: checkout per PR
        uses: actions/checkout@v4
        with:
          ref: sviluppo
          fetch-depth: 0
          path: bersaglio
          token: ${{ github.token }}
          # SECURITY: disabilita persistenza dopo il push
          persist-credentials: false

      - name: verifica integrità base
        working-directory: bersaglio
        env:
          EXPECTED_BASE: ${{ steps.metadata.outputs.base_sha }}
        run: |
          if [[ -z "$EXPECTED_BASE" ]]; then
            echo "::error::base_sha mancante"
            exit 1
          fi
          current_sha=$(git rev-parse HEAD)
          if [[ "$current_sha" != "$EXPECTED_BASE" ]]; then
            echo "::error::sviluppo è cambiato: attesa $EXPECTED_BASE, attuale $current_sha"
            exit 1
          fi

      - name: importa commit da bundle
        working-directory: bersaglio
        run: |
          git bundle verify /tmp/artifact/commiti.bundle
          new_head=$(git bundle unbundle /tmp/artifact/commiti.bundle | head -1 | cut -d' ' -f1)
          [[ -n "$new_head" ]] && git reset --hard "$new_head"

      - name: la Pull Request
        working-directory: bersaglio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git log origin/sviluppo..HEAD --oneline)" ]; then
            echo "nessun commit da pushare"
            exit 0
          fi
          
          ramo="turno/${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$ramo"

          corpo=/tmp/corpo.md
          [[ -f "/tmp/artifact/stato/RAPPORTO.md" ]] && cp "/tmp/artifact/stato/RAPPORTO.md" "$corpo" || echo "Rapporto non disponibile" > "$corpo"
          
          {
            echo ""
            echo "---"
            echo "*Aperta dal turno notturno. Da rivedere prima del merge.*"
            echo ""
            echo "Job: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$corpo"

          gh pr create --base sviluppo --head "$ramo" \
            --title "turno notturno $(date -u +%d/%m) — $(git log origin/sviluppo..HEAD --oneline | wc -l) commit" \
            --body-file "$corpo"
