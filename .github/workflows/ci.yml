# Il giudice indipendente.
#
# Gira su GitHub, non sulla macchina del loop, su tre versioni di Python.
# Il loop NON puo' modificare questo file: `.github/workflows/` e' in
# PERCORSI_VIETATI e la guardia boccia il diff prima del commit.
#
# Se la CI e' rossa e i test locali erano verdi, ha ragione la CI.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: solo lettura per i test
permissions:
  contents: read

# Evita run multipli sulla stessa PR quando non serve
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Checkout senza credenziali persistenti: non serve push qui
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa il pacchetto e le dipendenze di test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest

  # Controllo che non costa nulla e che un giorno salvera' la giornata:
  # la libreria deve importarsi SENZA le dipendenze di test installate.
  # Se qualcuno infila `stdnum` dentro `italia/`, qui si accorge subito.
  runtime-pulito:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout senza credenziali persistenti
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa SOLO il pacchetto, senza extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Importa la libreria a mani nude
        working-directory: /tmp
        run: |
          python -c "import italia; print('italia-toolkit', italia.__version__)"

      - name: Nessuna dipendenza di runtime deve essere finita nel pacchetto
        run: |
          if python -c "import stdnum" 2>/dev/null; then
            echo "::error::stdnum risulta installato: e' finito fra le dipendenze di runtime"
            exit 1
          fi
          echo "ok: stdnum non installato, la libreria gira a mani nude"
